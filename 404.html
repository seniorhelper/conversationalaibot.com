<style>
:root{--void:#050A18;--line:#1E3157;--signal:#0A84FF;--glow:#22D3FF;
  --display:'Space Grotesk',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif}

body{margin:0;min-height:100vh;background:var(--void);color:#E8F0FB;font-family:var(--body);

<script>
(function(){
  var cv=document.getElementById('sky'), ctx=cv.getContext('2d'), st=[], w,h,raf;
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){
    var d=Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight;
    cv.width=w*d; cv.height=h*d; cv.style.width=w+'px'; cv.style.height=h+'px'; ctx.setTransform(d,0,0,d,0,0);
    st=[]; var n=Math.round(Math.min(300,(w*h)/3500));
    for(var i=0;i<n;i++) st.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+.25,
      a:Math.random()*.6+.2,s:Math.random()*.016+.004,d:Math.random()*6.28,v:Math.random()*.05+.012});
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    var g=ctx.createRadialGradient(w*.5,h*.4,0,w*.5,h*.4,Math.max(w,h)*.7);
    g.addColorStop(0,'rgba(44,120,255,.12)'); g.addColorStop(1,'rgba(44,120,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    for(var i=0;i<st.length;i++){ var s=st[i];
      if(!still){ s.d+=s.s; s.y-=s.v; if(s.y<-2) s.y=h+2; }
      var a=still?s.a:s.a*(.62+.38*Math.sin(s.d));
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832);
      ctx.fillStyle='rgba(203,232,255,'+a.toFixed(3)+')'; ctx.fill();
    }
    if(!still) raf=requestAnimationFrame(draw);
  }
  addEventListener('resize',function(){ clearTimeout(cv._t); cv._t=setTimeout(function(){ if(raf)cancelAnimationFrame(raf); size(); draw(); },180); });
  size(); draw();
})();
</script>
